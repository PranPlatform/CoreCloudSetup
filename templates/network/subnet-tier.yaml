AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Reusable subnet tier: two subnets (one per AZ), one route table per subnet and a
  tier NACL. Deployed once per tier (public, private, data).
    public  - default route to the internet gateway.
    private - no default route here; the NAT stack adds it (so NAT can be removed
              without touching subnets).
    data    - isolated: no route out of the VPC; NACL only admits private + data
              tier traffic. Also creates RDS and ElastiCache subnet groups.

Parameters:
  StackPrefix:
    Type: String
    Description: Prefix reserved for foundation resources (stacks, IAM, SSM paths).
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
  TierName:
    Type: String
    AllowedValues: [public, private, data]
    Description: Which tier this stack builds.
  VpcId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>
    Description: SSM parameter holding the VPC ID.
  InternetGatewayId:
    Type: AWS::SSM::Parameter::Value<String>
    Description: SSM parameter holding the internet gateway ID (used by the public tier only).
  CidrA:
    Type: String
    Description: CIDR of the subnet in the first availability zone.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"
  CidrB:
    Type: String
    Description: CIDR of the subnet in the second availability zone.
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"
  PeerCidrA:
    Type: String
    Default: ""
    Description: Data tier only - first private subnet CIDR allowed through the NACL.
  PeerCidrB:
    Type: String
    Default: ""
    Description: Data tier only - second private subnet CIDR allowed through the NACL.

Rules:
  DataTierNeedsPeerCidrs:
    RuleCondition: !Equals [!Ref TierName, data]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref PeerCidrA, ""]]
          - !Not [!Equals [!Ref PeerCidrB, ""]]
        AssertDescription: The data tier requires PeerCidrA and PeerCidrB (the private subnet CIDRs).

Conditions:
  IsPublic: !Equals [!Ref TierName, public]
  IsData: !Equals [!Ref TierName, data]
  IsNotData: !Not [!Condition IsData]

Resources:
  # ---------------------------------------------------------------- subnets
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref CidrA
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${TierName}-a
        - Key: Tier
          Value: !Ref TierName

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref CidrB
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${TierName}-b
        - Key: Tier
          Value: !Ref TierName

  # ----------------------------------------------------------- route tables
  RouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${TierName}-a
        - Key: Tier
          Value: !Ref TierName

  RouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${TierName}-b
        - Key: Tier
          Value: !Ref TierName

  RouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTableA

  RouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTableB

  InternetRouteA:
    Type: AWS::EC2::Route
    Condition: IsPublic
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  InternetRouteB:
    Type: AWS::EC2::Route
    Condition: IsPublic
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  # ------------------------------------------------------------------- NACL
  NetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-${TierName}
        - Key: Tier
          Value: !Ref TierName

  NetworkAclAssociationA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref SubnetA
      NetworkAclId: !Ref NetworkAcl

  NetworkAclAssociationB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref SubnetB
      NetworkAclId: !Ref NetworkAcl

  OutboundAllowAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NetworkAcl
      Egress: true
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      CidrBlock: 0.0.0.0/0

  # Public and private tiers: NACL is open, security groups do the filtering.
  InboundAllowAll:
    Type: AWS::EC2::NetworkAclEntry
    Condition: IsNotData
    Properties:
      NetworkAclId: !Ref NetworkAcl
      Egress: false
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      CidrBlock: 0.0.0.0/0

  # Data tier: only private-tier and intra-data-tier traffic gets in.
  InboundFromPeerA:
    Type: AWS::EC2::NetworkAclEntry
    Condition: IsData
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030] # empty default; enforced by the DataTierNeedsPeerCidrs rule
    Properties:
      NetworkAclId: !Ref NetworkAcl
      Egress: false
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref PeerCidrA

  InboundFromPeerB:
    Type: AWS::EC2::NetworkAclEntry
    Condition: IsData
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030] # empty default; enforced by the DataTierNeedsPeerCidrs rule
    Properties:
      NetworkAclId: !Ref NetworkAcl
      Egress: false
      RuleNumber: 110
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref PeerCidrB

  InboundFromSelfA:
    Type: AWS::EC2::NetworkAclEntry
    Condition: IsData
    Properties:
      NetworkAclId: !Ref NetworkAcl
      Egress: false
      RuleNumber: 120
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref CidrA

  InboundFromSelfB:
    Type: AWS::EC2::NetworkAclEntry
    Condition: IsData
    Properties:
      NetworkAclId: !Ref NetworkAcl
      Egress: false
      RuleNumber: 130
      Protocol: -1
      RuleAction: allow
      CidrBlock: !Ref CidrB

  # ---------------------------------------------------- data subnet groups
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: IsData
    Properties:
      DBSubnetGroupName: !Sub ${StackPrefix}-data
      DBSubnetGroupDescription: !Sub Data tier subnets of the ${StackPrefix} VPC.
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Condition: IsData
    Properties:
      CacheSubnetGroupName: !Sub ${StackPrefix}-data
      Description: !Sub Data tier subnets of the ${StackPrefix} VPC.
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  # --------------------------------------------------------- SSM outputs
  SubnetAIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackPrefix}/network/subnets/${TierName}/a/id
      Type: String
      Value: !Ref SubnetA
      Description: !Sub ID of the ${TierName} subnet in the first AZ.

  SubnetBIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackPrefix}/network/subnets/${TierName}/b/id
      Type: String
      Value: !Ref SubnetB
      Description: !Sub ID of the ${TierName} subnet in the second AZ.

  SubnetIdsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackPrefix}/network/subnets/${TierName}/ids
      Type: StringList
      Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]
      Description: !Sub IDs of all ${TierName} subnets.

  SubnetCidrsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackPrefix}/network/subnets/${TierName}/cidrs
      Type: StringList
      Value: !Join [",", [!Ref CidrA, !Ref CidrB]]
      Description: !Sub CIDRs of all ${TierName} subnets.

  RouteTableAIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackPrefix}/network/route-tables/${TierName}/a/id
      Type: String
      Value: !Ref RouteTableA
      Description: !Sub ID of the ${TierName} route table in the first AZ.

  RouteTableBIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${StackPrefix}/network/route-tables/${TierName}/b/id
      Type: String
      Value: !Ref RouteTableB
      Description: !Sub ID of the ${TierName} route table in the second AZ.

  DbSubnetGroupParameter:
    Type: AWS::SSM::Parameter
    Condition: IsData
    Properties:
      Name: !Sub /${StackPrefix}/network/db-subnet-group/name
      Type: String
      Value: !Ref DbSubnetGroup
      Description: Name of the RDS DB subnet group in the data tier.

  CacheSubnetGroupParameter:
    Type: AWS::SSM::Parameter
    Condition: IsData
    Properties:
      Name: !Sub /${StackPrefix}/network/cache-subnet-group/name
      Type: String
      Value: !Ref CacheSubnetGroup
      Description: Name of the ElastiCache subnet group in the data tier.

Outputs:
  SubnetAId:
    Description: Subnet in the first AZ.
    Value: !Ref SubnetA
  SubnetBId:
    Description: Subnet in the second AZ.
    Value: !Ref SubnetB
  RouteTableAId:
    Description: Route table of the subnet in the first AZ.
    Value: !Ref RouteTableA
  RouteTableBId:
    Description: Route table of the subnet in the second AZ.
    Value: !Ref RouteTableB
  DbSubnetGroupName:
    Condition: IsData
    Description: RDS DB subnet group.
    Value: !Ref DbSubnetGroup
  CacheSubnetGroupName:
    Condition: IsData
    Description: ElastiCache subnet group.
    Value: !Ref CacheSubnetGroup
